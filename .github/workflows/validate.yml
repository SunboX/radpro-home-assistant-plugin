name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      # Run the same repository validation logic that HACS uses for integrations.
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
